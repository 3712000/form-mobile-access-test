<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202920"><title>FORM 手机访问测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#202920;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;line-height:1.8}main{max-width:520px;margin:8vh auto;padding:28px}.logo{font-size:42px;font-weight:900;letter-spacing:-2px}.logo span{color:#759f29}h1{font-size:28px;margin:32px 0 12px}.box{background:white;border:1px solid #d9dfd0;border-radius:16px;padding:22px;margin:24px 0}button{font:inherit;border:0;background:#324c37;color:white;border-radius:10px;padding:13px 18px;width:100%;cursor:pointer}small,p{color:#67715f}#result{font-weight:700;color:#324c37;min-height:30px}.note{font-size:12px}</style></head><body><main><div class="logo">FORM<span>↗</span></div><h1>手机访问成功</h1><p>如果你能看到这句话，说明手机已成功打开新的 GitHub Pages 地址。</p><section class="box"><h2 style="font-size:18px">再试一下记录功能</h2><button id="test" type="button">点一下，保存一条测试记录</button><p id="result" role="status">正在检查浏览器存储…</p><small>点击后刷新页面，测试数字应当保留。不需要登录，也不会上传个人信息。</small></section><p>测试后回聊天告诉我：<strong>“能打开，数字也保留”</strong>，或描述卡在哪一步。</p><p class="note">这是访问测试页，暂时不是正式训练日志。测试代码公开，不含你的训练记录、照片或访问口令。</p></main><script>let count=0;const output=document.querySelector('#result');try{count=Number(localStorage.getItem('form-access-test')||0);output.textContent=count?'已保存 '+count+' 条测试记录':'浏览器存储可用，等待点击';document.querySelector('#test').onclick=()=>{try{localStorage.setItem('form-access-test',String(++count));output.textContent='已保存 '+count+' 条测试记录，刷新试试'}catch{output.textContent='页面能打开，但浏览器暂不允许保存数据'}}}catch{output.textContent='页面能打开，但浏览器暂不允许保存数据'}</script></body></html>
